<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- White Background -->
  <rect width="640" height="640" fill="#FFFFFF"/>
  
  <!-- Gold Shopping Cart Icon -->
  <g fill="#D4AF37">
    <!-- Top Bar -->
    <rect x="140" y="230" width="340" height="30" rx="4"/>
    <!-- Handle -->
    <rect x="450" y="230" width="30" height="70" rx="4"/>
    <!-- Cart Body -->
    <polygon points="160,270 460,270 440,400 180,400"/>
  </g>
  
  <!-- Dark Gray Wheels -->
  <circle cx="210" cy="440" r="32" fill="#2C2C2C"/>
  <circle cx="410" cy="440" r="32" fill="#2C2C2C"/>
  
  <!-- Gold Wheel Hubs -->
  <circle cx="210" cy="440" r="12" fill="#D4AF37"/>
  <circle cx="410" cy="440" r="12" fill="#D4AF37"/>

  <!-- Business Name -->
  <text x="320" y="510" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#2C2C2C" text-anchor="middle" letter-spacing="3">PAVILION VENTURE</text>
  
  <!-- Domain Name -->
  <text x="320" y="570" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">shop.pavilionventure.com</text>
</svg>
